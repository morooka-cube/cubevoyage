version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # minor / patch は 1 本の PR にまとめる（major は個別 PR のまま）
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # minor / patch は 1 本の PR にまとめる（major は個別 PR のまま）
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
