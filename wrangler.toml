name = "cubevoyage"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Workers Logs を有効化（/api/hit の console.log 計測イベントを保存・ダッシュボードで閲覧）。
# head_sampling_rate = 1 で全リクエストのログを記録する。
[observability]
enabled = true
head_sampling_rate = 1

# 自前 Web アナリティクス（ファーストパーティ計測）
# 既定では追加リソース不要：/api/hit が計測イベントを Workers Logs に出力する。
#
# 集計ダッシュボード（/admin/analytics）用の D1（無料枠）。
# /api/hit は ANALYTICS_DB があれば D1 に記録し、ダッシュボードが集計を表示する。
# スキーマ適用: npx wrangler d1 execute cubevoyage_analytics --remote --file schema.sql
# 閲覧キー設定: npx wrangler secret put ANALYTICS_DASH_KEY
[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "cubevoyage_analytics"
database_id = "970a406a-beaf-4f46-9a4f-de693d69eb5b"
