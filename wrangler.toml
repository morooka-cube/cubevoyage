name = "cubevoyage"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# 自前 Web アナリティクス（Cloudflare Workers Analytics Engine）
# 計測データの書き込み先データセット。初回書き込み時に自動作成される。
# 読み出し（ダッシュボード）に使う CF_ACCOUNT_ID / CF_API_TOKEN /
# ANALYTICS_DASH_KEY は `wrangler secret put` でシークレットとして設定する。
[[analytics_engine_datasets]]
binding = "WEB_ANALYTICS"
dataset = "cubevoyage_web_analytics"
